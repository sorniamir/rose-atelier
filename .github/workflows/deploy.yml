name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate storefront markup and functionality hooks
        run: |
          test -s index.html
          grep -q 'lang="fa" dir="rtl"' index.html
          grep -q 'productsGrid' index.html
          grep -q 'checkoutForm' index.html
          python -c 'import re; s=open("index.html", encoding="utf-8").read(); m=re.search(r"<script>(.*?)</script>", s, re.S); assert m, "inline app script missing"; open("/tmp/storefront.js","w",encoding="utf-8").write(m.group(1))'
          node --check /tmp/storefront.js
          echo "Storefront smoke checks and JavaScript syntax passed."
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
